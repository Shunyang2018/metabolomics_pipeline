[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metabolomics-pipeline"
version = "0.1.0"
description = "MS-DIAL post-processing pipeline: QC filtering, sample harmonization, SIRIUS and ClassyFire integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shunyang Wang" }]
keywords = [
  "metabolomics",
  "mass-spectrometry",
  "ms-dial",
  "sirius",
  "classyfire",
  "lc-ms",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "typer>=0.9",
  "rich>=13",
  "pyyaml>=6",
  "pandas>=2.1",
  # qc.py and dedup.py import numpy at module scope, so it is a hard
  # requirement rather than an optional extra (it previously appeared only
  # under [data] and was satisfied incidentally via pandas).
  "numpy>=1.25",
  "requests>=2.31",
]

[project.optional-dependencies]
stats = ["scikit-learn>=1.3", "statsmodels>=0.14"]
report = ["jinja2>=3.1", "matplotlib>=3.8", "seaborn>=0.13", "plotly>=5.18"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.6", "pre-commit>=3.5"]

[project.urls]
Homepage = "https://github.com/Shunyang2018/metabolomics_pipeline"
Repository = "https://github.com/Shunyang2018/metabolomics_pipeline"
Issues = "https://github.com/Shunyang2018/metabolomics_pipeline/issues"

[project.scripts]
metabo = "metabo_pipeline.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["metabo_pipeline*"]

# The ClassyFire seed cache ships with the package: it holds ~10k already
# classified InChIKeys, which spares users that many calls to a slow public API.
[tool.setuptools.package-data]
metabo_pipeline = ["classyfire_cache.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
